<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" fill="none">
  <defs>
    <linearGradient id="siyasBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120D1A"/>
      <stop offset="100%" stop-color="#241433"/>
    </linearGradient>
    <linearGradient id="siyasOrchidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="siyasGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (Luxury Botanical Orchid Flower & Gold Crown) -->
  <g transform="translate(6, 4)">
    <!-- Base Outer Circle Ring -->
    <circle cx="26" cy="28" r="24" fill="url(#siyasBgGrad)" stroke="url(#siyasGoldGrad)" stroke-width="1.8"/>
    <!-- Blooming Petals -->
    <path d="M26,12 C22,18 17,25 26,36 C35,25 30,18 26,12 Z" fill="url(#siyasOrchidGrad)" opacity="0.9"/>
    <path d="M14,24 C19,26 23,30 26,38 C21,34 16,33 14,24 Z" fill="url(#siyasOrchidGrad)" opacity="0.75"/>
    <path d="M38,24 C33,26 29,30 26,38 C31,34 36,33 38,24 Z" fill="url(#siyasOrchidGrad)" opacity="0.75"/>
    <!-- Gold Central Stamen / Jewel -->
    <circle cx="26" cy="30" r="2.8" fill="#FBBF24"/>
    <circle cx="26" cy="18" r="1.2" fill="#FDF4FF"/>
    <circle cx="20" cy="22" r="1" fill="#FDF4FF"/>
    <circle cx="32" cy="22" r="1" fill="#FDF4FF"/>
  </g>

  <!-- Main Brand Typography (For Light Background) -->
  <text x="66" y="27" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="22" fill="#120D1A" letter-spacing="1.5">SIYAS LUXURY</text>
  <text x="67" y="42" font-family="'Outfit', system-ui, sans-serif" font-weight="800" font-size="9.5" fill="#D946EF" letter-spacing="2.6">SPA &amp; SALON • KOLAR ROAD BHOPAL</text>
  <text x="67" y="53" font-family="'Outfit', system-ui, sans-serif" font-weight="600" font-size="7.5" fill="#78716C" letter-spacing="1.4">BRIDAL SUITE • MOROCCAN HAMMAM • ESTD. 2016</text>
</svg>
